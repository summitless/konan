# Release Konan
#
# 触发: workflow_dispatch (手动触发)。
# Runner: 单台 macOS self-hosted runner (label: self-hosted, macOS)。
#         Windows 构建/relink 通过 ssh 到 PD Win11 VM (alias: win11) 完成。
# Author 显示: github-actions[bot] (用内置 GITHUB_TOKEN, 不暴露真人账号)。
#
# 本文件源文件位于 Private 分支的 lgpl_dist/.github/workflows/release.yml,
# pixi run lgpl 后由 generate_lgpl.py 留在 lgpl_dist/, 用户把 lgpl_dist/
# 内容刷到 lgpl 分支根, 这个 yml 就出现在 summitless/konan 默认分支的
# .github/workflows/, GitHub UI 才能看到+触发。
#
# 触发前置 (release skill 会逐项检查):
#   1. PD Win11 VM 启动, ssh win11 通
#   2. 本机 Clash 代理开启 (github push/release 走代理)
#   3. ssh 47 通 (forgejo origin 通过 LocalForward 2222 走它)
#   4. qt6-solution + 子模块工作树全部干净, Private 分支
#   5. 本机 Qt 装在 ~/Qt/6.8.3, Win11 Qt 装在 C:/Qt/6.8.3 (可在下面改)

name: Release Konan

on:
  workflow_dispatch:
    inputs:
      ingress_host:
        description: "Ingress base URL (烘进 app_config.json)"
        required: true
        default: "https://konan.summitless.io"
      auth_realm:
        description: "Keycloak realm (烘进 app_config.json)"
        required: true
        default: "prod"
      dry_run:
        description: "只构建+打包, 跳过 gh release create"
        type: boolean
        default: false

# GITHUB_TOKEN 默认 read-only (org default), 需要显式给 contents:write 才能
# 删/建 release; releases:write 是新写法,部分场景 contents:write 不够。
permissions:
  contents: write

env:
  # 单 macOS runner 上 Private 分支的 checkout 绝对路径。
  # 不用 actions/checkout — 我们要的是已经 sync 好的 Private 分支工作树
  # (含子模块 + 本地未 push 的 commit), 不是 lgpl 分支的快照。
  KONAN_SOURCE: /Users/hbb/source/repos/qt6-solution
  WIN11_SSH: win11
  QT_DIR_MAC: /Users/hbb/Qt/6.8.3
  QT_DIR_WIN: 'C:/Qt/6.8.3'
  ASSETS_DIR: /tmp/konan-release-assets

jobs:
  release:
    runs-on: [self-hosted, macOS]
    steps:
      - name: 校验源码工作树干净 + 在 Private 分支
        run: |
          set -e
          cd "$KONAN_SOURCE"
          BR=$(git branch --show-current)
          if [ "$BR" != "Private" ]; then
            echo "expected branch=Private, got=$BR"; exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "qt6-solution 工作树脏:"
            git status --short
            exit 1
          fi
          # 子模块也得干净 (顶层 status 只看到 -dirty 标记不够直观)
          git submodule foreach --recursive '
            if [ -n "$(git status --porcelain)" ]; then
              echo "子模块 $name 脏:"; git status --short; exit 1
            fi
          '

      - name: 读取版本号
        id: version
        run: |
          # 顶层 CMakeLists.txt 的 project(... VERSION X.Y.Z) 是真相源
          VER=$(awk -F'VERSION ' '/^project\(/ { gsub(/[^0-9.].*/, "", $2); print $2; exit }' "$KONAN_SOURCE/CMakeLists.txt")
          if [ -z "$VER" ]; then echo "未能从 CMakeLists.txt 解析版本"; exit 1; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"   >> "$GITHUB_OUTPUT"
          echo "Konan version: $VER"

      - name: 决定是否需要重建 (基于源码内容 hash, 排除 CI/工作流改动)
        id: cache_check
        run: |
          set -e
          cd "$KONAN_SOURCE"
          # HEAD short hash 只用于 release asset 命名 (用户能 git checkout
          # 到这个 commit), 不参与 cache 判断。
          HEAD_HASH=$(git rev-parse --short=8 HEAD)
          echo "hash=$HEAD_HASH" >> "$GITHUB_OUTPUT"

          # SRC_HASH = 影响构建产物的文件集合的内容 hash。
          # 计算方式: 对每个路径取 git rev-parse HEAD:<path> (目录 → tree
          # hash, 文件 → blob hash), 串起来 sha256 再截前 8 位。任一文件
          # 内容变 → 它的 hash 变 → 总 hash 变。
          # 列表里只放真正影响二进制的:src/ 整棵, 顶层 CMakeLists, pixi
          # env, build/dev/lgpl-生成脚本。**不放** workflow yaml /
          # release_dispatch.py / .claude/ / docs/ / lgpl_dist/.github/
          # 这些纯 CI/工具改动不该让 cache 失效。
          SRC_HASH=$(
            {
              git rev-parse HEAD:src
              git rev-parse HEAD:CMakeLists.txt
              git rev-parse HEAD:pixi.toml.in
              git rev-parse HEAD:scripts/build.py
              git rev-parse HEAD:scripts/dev_mac.py
              git rev-parse HEAD:scripts/dev_ios.py
              git rev-parse HEAD:scripts/dev_android.py
              git rev-parse HEAD:scripts/dev_windows.py
              git rev-parse HEAD:scripts/generate_lgpl.py
            } 2>/dev/null | shasum -a 256 | cut -c1-8
          )
          echo "src_hash=$SRC_HASH" >> "$GITHUB_OUTPUT"

          MARKER="lgpl_dist/relink/.built-from-hash"
          # 只有 marker 命中 (跟 SRC_HASH 一致), 且 4 个平台 relink 输出
          # 都齐, 才跳过 build/relink。缺一个 (e.g. windows 上次失败) 就
          # 重做整套。
          if [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SRC_HASH" ] \
             && [ -d lgpl_dist/relink/macos ]   && [ -d lgpl_dist/relink/ios ] \
             && [ -d lgpl_dist/relink/android ] && [ -d lgpl_dist/relink/windows ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "src hash $SRC_HASH 命中, 跳过 build/relink, 直接打包发布 (HEAD=$HEAD_HASH)"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            echo "src hash $SRC_HASH 无对应 relink 结果, 走完整 build → relink (HEAD=$HEAD_HASH)"
          fi

      - name: 构建 macOS (arm64 + x86_64)
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          cd "$KONAN_SOURCE"
          for ARCH in arm64 x86_64; do
            python3 scripts/build.py --release --no-hotreload --arch "$ARCH" \
              --ingress-host "${{ inputs.ingress_host }}" \
              --realm "${{ inputs.auth_realm }}" \
              --bundle
          done

      - name: 构建 iOS (arm64, device)
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          cd "$KONAN_SOURCE"
          python3 scripts/build.py --release --no-hotreload --ios --arch arm64 \
            --ingress-host "${{ inputs.ingress_host }}" \
            --realm "${{ inputs.auth_realm }}"

      - name: 构建 Android (arm64-v8a + armeabi-v7a)
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          cd "$KONAN_SOURCE"
          for ABI in arm64-v8a armeabi-v7a; do
            python3 scripts/build.py --release --no-hotreload --android --arch "$ABI" \
              --ingress-host "${{ inputs.ingress_host }}" \
              --realm "${{ inputs.auth_realm }}"
          done

      - name: 同步源码到 Win11 (rsync over ssh)
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          cd "$KONAN_SOURCE"
          # 一次性 push, 不 watch。--gitignore 跳过 build/ .pixi/ 等; --git
          # 带 .git/ 让 win11 端也能跑 git 命令(submodule 状态 / hash 注入)。
          python3 scripts/sync.py "${WIN11_SSH}:~/source/repos/qt6-solution/" --gitignore --git

      - name: 在 Win11 上构建 Windows (x86_64 + arm64)
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          # dev_windows.py 不接受 --no-hotreload (release 默认就关 hotreload)
          # 但要 --no-launch, 避免 build 完自动启 exe
          for ARCH in x86_64 arm64; do
            ssh "$WIN11_SSH" "cd ~/source/repos/qt6-solution && \
              pixi run windows -- --release --no-launch --arch $ARCH \
              --ingress-host '${{ inputs.ingress_host }}' \
              --realm '${{ inputs.auth_realm }}'"
          done

      - name: 拉回 Win11 build/ 产出
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          for ARCH in x86_64 arm64; do
            mkdir -p "$KONAN_SOURCE/build/win-${ARCH}-release"
            rsync -a --delete \
              "${WIN11_SSH}:~/source/repos/qt6-solution/build/win-${ARCH}-release/" \
              "$KONAN_SOURCE/build/win-${ARCH}-release/"
          done

      - name: 生成 lgpl_dist (含 VERSION 文件)
        # 不 gate 在 skip_build —— 即便源码 hash 没变, 工作流 yaml / 文档 /
        # lgpl 分支模板等也可能更新, 总是重新生成 lgpl_dist 让它跟 Private
        # 当前工作树一致 (pixi run lgpl 是从 build/ 增量同步, 没改动时也很快)。
        run: |
          cd "$KONAN_SOURCE"
          pixi run lgpl
          # 校验 VERSION 跟 CMakeLists 一致
          DIST_VER=$(cat lgpl_dist/VERSION)
          if [ "$DIST_VER" != "${{ steps.version.outputs.version }}" ]; then
            echo "lgpl_dist/VERSION ($DIST_VER) != CMake project version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: 推送 lgpl 分支 (lgpl_dist 内容 → summitless/lgpl, 1 版本 1 commit)
        # 不 gate 在 skip_build —— 即便 src 没变, 也要把 lgpl_dist (含工作流
        # yaml / README / NOTICE 等) 同步上去。push 步骤本身有 diff 检查,
        # 没变化时 commit 阶段会自动跳过。
        #
        # 流程: 用 git worktree 在 /tmp/konan-lgpl-wt 取 summitless/lgpl 当前
        # 内容 → 清空 → 用 lgpl_dist 覆盖 → add/commit/push。relink/ 由
        # lgpl_dist/.gitignore 排除, 不会进 lgpl 分支。
        #
        # 同版本 amend + force-with-lease, 跨版本新建 commit
        # (memory feedback_lgpl_one_commit_per_version: 1 版本 1 commit)。
        id: lgpl_push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$KONAN_SOURCE"
          git fetch summitless lgpl
          LGPL_WT=/tmp/konan-lgpl-wt
          if [ -d "$LGPL_WT" ]; then
            # 清掉旧 worktree (上一次 run 可能没善后)
            git worktree remove --force "$LGPL_WT" 2>/dev/null || rm -rf "$LGPL_WT"
          fi
          git worktree add -B lgpl "$LGPL_WT" summitless/lgpl

          # 用 lgpl_dist 覆盖 worktree。先清掉除 .git 外的所有文件 / 目录,
          # 再 rsync; 这样老版本里有但新版本没有的文件能被删掉。
          cd "$LGPL_WT"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a \
            --exclude='relink/' \
            --exclude='.pixi/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.DS_Store' \
            "$KONAN_SOURCE/lgpl_dist/" .

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          VER="${{ steps.version.outputs.version }}"
          HEAD_MSG=$(git log -1 --format=%s 2>/dev/null || echo "")
          if git diff --cached --quiet; then
            echo "lgpl_dist 与 lgpl 分支当前 HEAD 一致, 跳过 commit/push"
          elif [ "$HEAD_MSG" = "Konan v$VER" ]; then
            git commit --amend -m "Konan v$VER" --reset-author
            git push summitless lgpl --force-with-lease
            echo "已 amend Konan v$VER 并 force-with-lease 推送 (同版本 squash)"
          else
            git commit -m "Konan v$VER"
            git push summitless lgpl
            echo "已新建 Konan v$VER 推送到 summitless/lgpl"
          fi

          # 给后续步骤参考新 lgpl 分支 HEAD
          NEW_LGPL_SHA=$(git rev-parse HEAD)
          echo "lgpl_sha=$NEW_LGPL_SHA" >> "$GITHUB_OUTPUT"
          echo "lgpl_wt=$LGPL_WT"       >> "$GITHUB_OUTPUT"

      - name: relink 各平台/架构 → 可分发产物
        # 物理上在 $KONAN_SOURCE/lgpl_dist/ 跑 relink (避开 win11 端路径切换 +
        # 多 worktree pixi env 安装), 但前一步"推送 lgpl 分支"已经把 lgpl_dist
        # 推上去了 → 这时候 lgpl_dist 内容 == summitless/lgpl 当前 HEAD 内容,
        # 在这里 relink 等价于在 lgpl 分支 checkout 上 relink, 后续 package
        # 出来的 tarball 也就反映的是 lgpl 分支的最新内容。
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          set -e
          cd "$KONAN_SOURCE/lgpl_dist"
          pixi run relink macos   --arch arm64        --qt-dir "$QT_DIR_MAC"
          pixi run relink macos   --arch x86_64       --qt-dir "$QT_DIR_MAC"
          pixi run relink ios     --arch arm64        --qt-dir "$QT_DIR_MAC"
          pixi run relink android --arch arm64-v8a    --qt-dir "$QT_DIR_MAC"
          pixi run relink android --arch armeabi-v7a  --qt-dir "$QT_DIR_MAC"
          # Windows relink 在 win11 上跑 (x64/arm64 各自的 Qt + MSVC)
          # 先把 lgpl_dist (含刚生成的 windows/<arch>) sync 到 win11 让它有最新 staging
          cd "$KONAN_SOURCE"
          python3 scripts/sync.py "${WIN11_SSH}:~/source/repos/qt6-solution/" --gitignore --git
          ssh "$WIN11_SSH" "cd ~/source/repos/qt6-solution/lgpl_dist && \
            pixi run relink windows --arch x86_64 --qt-dir '$QT_DIR_WIN' && \
            pixi run relink windows --arch arm64  --qt-dir '$QT_DIR_WIN'"
          # 拉回 win11 的 relink 产出
          mkdir -p "$KONAN_SOURCE/lgpl_dist/relink/windows"
          rsync -a --delete \
            "${WIN11_SSH}:~/source/repos/qt6-solution/lgpl_dist/relink/windows/" \
            "$KONAN_SOURCE/lgpl_dist/relink/windows/"

      - name: 标记 relink 对应的源码 hash (下次同源码可跳过 build)
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          # 写 src_hash 而不是 HEAD hash: 后续仅 CI/workflow 改动 (HEAD 变
          # src 不变) 会命中 cache, 真源码改动 (HEAD 变 src 也变) 才重编。
          echo "${{ steps.cache_check.outputs.src_hash }}" \
            > "$KONAN_SOURCE/lgpl_dist/relink/.built-from-hash"
          echo "marker: $(cat $KONAN_SOURCE/lgpl_dist/relink/.built-from-hash)"

      - name: 打包 release assets
        run: |
          set -e
          DIST="$ASSETS_DIR"
          rm -rf "$DIST"; mkdir -p "$DIST"
          VER="${{ steps.version.outputs.version }}"
          # 8 字符 git hash 作为包名后缀, 同 release 不同 build 之间也能区分
          # (e.g. workflow YAML 改了 → hash 变 → 重出包但 VERSION 不变)
          HASH="${{ steps.cache_check.outputs.hash }}"
          cd "$KONAN_SOURCE/lgpl_dist/relink"
          # macOS: ditto-zip 保留扩展属性 + 签名结构
          for ARCH in arm64 x86_64; do
            ditto -c -k --keepParent "macos/$ARCH/Konan.app" "$DIST/Konan-$VER-macos-$ARCH-$HASH.zip"
          done
          # Windows: zip bin/ 目录
          for ARCH in x86_64 arm64; do
            ( cd "windows/$ARCH" && zip -qr "$DIST/Konan-$VER-windows-$ARCH-$HASH.zip" bin )
          done
          # Android: APK
          for ABI in arm64-v8a armeabi-v7a; do
            APK=$(ls android/$ABI/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
            if [ -z "$APK" ]; then
              # 备用路径: androiddeployqt 直接放在 release 子目录
              APK=$(ls android/$ABI/*.apk 2>/dev/null | head -1)
            fi
            if [ -z "$APK" ]; then echo "找不到 android/$ABI APK"; exit 1; fi
            cp "$APK" "$DIST/Konan-$VER-android-$ABI-$HASH.apk"
          done
          # iOS: 源码 tarball (用户用自己的 Apple ID 在 Xcode 重签)
          # ../ios 是 lgpl_dist/ios/<arch>/ 的父级 = lgpl_dist/ios; 但 relink/ios 才是
          # relink 产物。取 relink 产物 + 源 staging 一起打:用户拿到后直接 open xcodeproj。
          tar -czf "$DIST/Konan-$VER-ios-source-$HASH.tar.gz" -C "$KONAN_SOURCE/lgpl_dist" ios

      - name: 生成 SHA256 sidecar + SHA256SUMS
        run: python3 "$KONAN_SOURCE/scripts/release_sha256.py" "$ASSETS_DIR"

      - name: 生成中英双语 release notes
        # 取上一次 GitHub release 的 published_at 时间戳, 把 Private 分支自此
        # 之后的所有 commit 喂给 release_notes.py 自动分类成 features/fixes/
        # other, 过滤掉 CI/工具琐碎提交。qt6-solution Private 分支不打 v* tag
        # (tag 只在 summitless/konan 上由 gh release 创建), 所以用时间戳切片。
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          # 拿最近 2 个 release; 跳过同名 (重发场景), 取真正的"上一个"
          PREV_DATE=$(gh api 'repos/summitless/konan/releases?per_page=10' \
            --jq ".[] | select(.tag_name != \"$TAG\") | .published_at" \
            | head -1)
          # 注意: notes 不放在 $ASSETS_DIR 里, 否则下一步的
          # `$ASSETS_DIR/*` glob 会把 notes 也作为 release asset 上传。
          NOTES_FILE="/tmp/konan-release-notes.md"
          if [ -n "$PREV_DATE" ]; then
            echo "上次 release published_at = $PREV_DATE"
            python3 "$KONAN_SOURCE/scripts/release_notes.py" \
              "${{ steps.version.outputs.version }}" \
              --since "$PREV_DATE" \
              --repo "$KONAN_SOURCE" \
              > "$NOTES_FILE"
          else
            echo "无上一次 release, 走 tag 回退/首发分支"
            python3 "$KONAN_SOURCE/scripts/release_notes.py" \
              "${{ steps.version.outputs.version }}" \
              --repo "$KONAN_SOURCE" \
              > "$NOTES_FILE"
          fi
          echo "---- generated notes ----"
          cat "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          # 同 tag 已存在就先删 (tag + release 都清掉, 让重发干净)
          if gh release view "$TAG" --repo summitless/konan >/dev/null 2>&1; then
            gh release delete "$TAG" --repo summitless/konan --yes --cleanup-tag
          fi
          # target_commitish=lgpl: release 关联到 lgpl 分支顶部 commit
          # (此时 lgpl HEAD = "Konan v$VER", 由前面的 lgpl push 步骤创建)
          # --notes-file 用 release_notes.py 生成的中英双语 markdown
          gh release create "$TAG" \
            --repo summitless/konan \
            --target lgpl \
            --title "Konan $TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            "$ASSETS_DIR"/*

      - name: Summary
        run: |
          echo "=== Assets ==="
          ls -lh "$ASSETS_DIR"
          echo ""
          echo "=== SHA256SUMS ==="
          cat "$ASSETS_DIR/SHA256SUMS"
